<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocoAssets | Vendors</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-brand">LocoAssets</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li><a href="employees.html">Employees</a></li>
                <li><a href="vendors.html" class="active">Vendors</a></li>
                <li><a href="maintenance.html">Maintenance</a></li>
                <li><a href="audit.html">Audits</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Vendor Directory</h2>
                <div class="user-info">
                    <span id="userName" style="font-weight: 500;">User</span>
                    <button id="logoutBtn" class="btn btn-danger btn-small">Logout</button>
                </div>
            </header>

            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>All Vendors</h3>
                    <button class="btn btn-primary" onclick="openModal()">+ Add Vendor</button>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Vendor Name</th>
                                <th>Contact Person</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vendorsTableBody">
                            <tr>
                                <td>1</td>
                                <td><strong>Apple Inc.</strong></td>
                                <td>Tim Cook</td>
                                <td>contact@apple.com</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td><strong>Dell Technologies</strong></td>
                                <td>Michael Dell</td>
                                <td>support@dell.com</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="vendorModal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3>Add New Vendor</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="vendorForm">
                <div class="input-group">
                    <label>Vendor Name</label>
                    <input type="text" id="vendorName" required maxlength="100" pattern=".*\S+.*" title="This field cannot be only blank spaces (max 100 characters)">
                </div>
                <div class="input-group">
                    <label>Contact Person</label>
                    <input type="text" id="vendorContact" required maxlength="50" pattern="^[a-zA-Z\s]+$" title="Only letters and spaces are allowed (max 50 characters)">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <!-- Strict Email Validation using type="email" and a regex pattern -->
                    <input type="email" id="vendorEmail" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="example@domain.com">
                </div>
                <div class="input-group">
                    <label>Phone Number (10 digits)</label>
                    <!-- Strict Phone Number Validation (10 numbers exactly) -->
                    <input type="tel" id="vendorPhone" required pattern="[0-9]{10}" placeholder="1234567890" title="Phone number must be exactly 10 digits">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn" style="background: rgba(0,0,0,0.1);" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Vendor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/vendors.js"></script>
</body>
</html>
