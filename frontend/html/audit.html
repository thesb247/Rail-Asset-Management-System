<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocoAssets | Audits</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-brand">LocoAssets</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li><a href="employees.html">Employees</a></li>
                <li><a href="vendors.html">Vendors</a></li>
                <li><a href="maintenance.html">Maintenance</a></li>
                <li><a href="audit.html" class="active">Audits</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Audit Logs</h2>
                <div class="user-info">
                    <span id="userName" style="font-weight: 500;">User</span>
                    <button id="logoutBtn" class="btn btn-danger btn-small">Logout</button>
                </div>
            </header>

            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>Recent Audits</h3>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Auditor</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button id="prevPage" class="pagination-btn" onclick="changePage(-1)" disabled>Previous</button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button id="nextPage" class="pagination-btn" onclick="changePage(1)" disabled>Next</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/audit.js"></script>
</body>
</html>
