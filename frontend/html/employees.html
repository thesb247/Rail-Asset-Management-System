<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocoAssets | Employees</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-brand">LocoAssets</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li><a href="employees.html" class="active">Employees</a></li>
                <li><a href="vendors.html">Vendors</a></li>
                <li><a href="maintenance.html">Maintenance</a></li>
                <li><a href="audit.html">Audits</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Employee Directory</h2>
                <div class="user-info">
                    <span id="userName" style="font-weight: 500;">User</span>
                    <button id="logoutBtn" class="btn btn-danger btn-small">Logout</button>
                </div>
            </header>

            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>All Employees</h3>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <input type="text" id="employeeSearch" placeholder="Search employees..." style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        <select id="employeeFilter" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                            <option value="All">All Departments</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Operations">Operations</option>
                            <option value="Finance">Finance</option>
                        </select>
                        <button class="btn btn-primary" onclick="openModal()">+ Add Employee</button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Department</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTableBody">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button id="prevPage" class="pagination-btn" onclick="changePage(-1)" disabled>Previous</button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button id="nextPage" class="pagination-btn" onclick="changePage(1)" disabled>Next</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal-overlay" id="employeeModal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3>Add New Employee</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="employeeForm">
                <div class="input-group">
                    <label>Employee Name</label>
                    <input type="text" id="employeeName" required maxlength="50" pattern="^[a-zA-Z\s]+$" title="Only letters and spaces are allowed (max 50 characters)">
                </div>
                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" id="employeeEmail" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="employee@domain.com">
                </div>
                <div class="input-group">
                    <label>Phone Number (10 digits)</label>
                    <input type="tel" id="employeePhone" required pattern="[0-9]{10}" placeholder="1234567890" title="Phone number must be exactly 10 digits">
                </div>
                <div class="input-group">
                    <label>Department</label>
                    <select id="employeeDepartment" required>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Operations">Operations</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="employeeRole" required>
                        <option value="Admin">Admin</option>
                        <option value="User">User</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn" style="background: rgba(0,0,0,0.1);" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/employees.js"></script>
</body>
</html>
